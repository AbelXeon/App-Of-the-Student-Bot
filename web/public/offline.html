<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Study Bot</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1220; color: #e8edf7; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px; background: #2dd4bf; color: #04201c; font: inherit; font-weight: 700; }
      p { color: #93a0b8; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 48px">📡</div>
      <h1>You're offline</h1>
      <p>Study Bot needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
